name = "intangybl"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
MODEL = "claude-sonnet-5"
ALLOWED_ORIGINS = "https://intangybl.com,https://www.intangybl.com"

# Per-IP rate limit: 10 scoring requests per 60 seconds.
# Remove this block if your account doesn't have the rate-limiting binding yet;
# the worker checks for env.RATE_LIMITER and skips the limit when it's absent.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# ANTHROPIC_API_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
